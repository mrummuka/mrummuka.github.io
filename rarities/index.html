<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geokätköanalyysi</title>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
    
    <!-- Add Leaflet.markercluster CSS/JS to <head> -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <style>
        #map {
            height: 50vh;
            min-height: 300px;
            width: 100%;
            margin-top: 20px;
        }
        
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        table {
            border-collapse: collapse;
            margin-top: 20px;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 5px;
        }

        th {
            background: #eee;
            vertical-align: bottom;
        }

        .highlight-marker {
            background-color: #ffff00;
            padding: 4px;
            border-radius: 4px;
            font-weight: bold;
        }

        th select {
            margin-top: 4px;
            width: 100%;
        }

        button, select, input[type="file"] {
            font-size: 1rem;
            margin: 5px 0;
            max-width: 100%;
        }

        /* Poistettu aiempi responsiivinen CSS, joka rikkoi DataTables-suodattimet */
        /* Taulukko on nyt vieritettävissä sivusuunnassa DataTablesin scrollX-asetuksella */

        /* For highlighting table row */
        .row-highlight {
            background-color: #ffeb3b !important; /* A bright yellow */
        }

    </style>
</head>

<body>
    <h1>Etsi harvinaiset kätköt</h1>
    <label for="fileType">Tiedostotyyppi:</label>
    <select id="fileType">
        <option value="csv">CSV</option>
        <option value="gpx">GPX</option>
    </select>
    <input type="file" id="inputFile" accept=".csv,.gpx">
    <br>
    <br>
    <button onclick="processFile()">Analysoi</button>
    <label><input type="checkbox" id="showCountry" checked> Maa</label>
    <label><input type="checkbox" id="showRegion" checked> Alue</label>
    <label><input type="checkbox" id="showCounty" checked> Kunta</label>
    <br>
    <label><input type="checkbox" id="showAll"> Näytä kaikki kätköt</label>
    <!-- <label><input type="checkbox" id="showHeatmap"> Näytä lämpökartta</label> -->
    <div id="map"></div>
    <button onclick="exportSelectedToGPX()">Lataa GPX-valitut</button>
    <div id="results"></div>

    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="rarities.js"></script>
</body>

</html>
