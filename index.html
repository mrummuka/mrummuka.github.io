    <div id="results"></div>

function parseGPX(file) {
    const parser = new DOMParser();
    const reader = new FileReader();

    reader.onload = function(event) {
        const xml = event.target.result;
        const doc = parser.parseFromString(xml, "application/xml");
        const ns = {
            gpx: "http://www.topografix.com/GPX/1/0",
            groundspeak: "http://www.groundspeak.com/cache/1/0/1",
            gsak: "http://www.gsak.net/xmlv1/6"
        };

        const wpts = doc.getElementsByTagNameNS(ns.gpx, "wpt");
        let total = 0;
        const types = {};
        const sizes = {};
        const difficulties = {};
        const terrains = {};
        const diffTerrPairs = {};
        const attributes = {};
        const countries = new Set();
        const states = new Set();
        let oldestDate = null;
        let favoSum = 0;
        let attrib4Terrain5Found = false;
        let attrib4_11_12Found = false;

        for (let wpt of wpts) {
            total++;
            const cache = wpt.getElementsByTagNameNS(ns.groundspeak, "cache")[0];
            if (!cache) continue;

            // Type
            const type = cache.getElementsByTagNameNS(ns.groundspeak, "type")[0]?.textContent || "?";
            types[type] = (types[type] || 0) + 1;

            // Size/Container
            const container = cache.getElementsByTagNameNS(ns.groundspeak, "container")[0]?.textContent || "?";
            sizes[container] = (sizes[container] || 0) + 1;

            // Difficulty/Terrain
            const difficulty = parseFloat(cache.getElementsByTagNameNS(ns.groundspeak, "difficulty")[0]?.textContent || "0");
            const terrain = parseFloat(cache.getElementsByTagNameNS(ns.groundspeak, "terrain")[0]?.textContent || "0");
            difficulties[difficulty] = (difficulties[difficulty] || 0) + 1;
            terrains[terrain] = (terrains[terrain] || 0) + 1;
            diffTerrPairs[`${difficulty}/${terrain}`] = (diffTerrPairs[`${difficulty}/${terrain}`] || 0) + 1;

            // Date
            const timeText = wpt.getElementsByTagName("time")[0]?.textContent;
            if (timeText) {
                const date = new Date(timeText);
                if (!oldestDate || date < oldestDate) {
                    oldestDate = date;
                }
            }

            // Country/State
            const country = cache.getElementsByTagNameNS(ns.groundspeak, "country")[0]?.textContent || "";
            const state = cache.getElementsByTagNameNS(ns.groundspeak, "state")[0]?.textContent || "";
            if (country.trim()) countries.add(country.trim());
            if (state.trim()) states.add(state.trim());

            // Attributes
            const attSet = new Set();
            const attParent = cache.getElementsByTagNameNS(ns.groundspeak, "attributes")[0];
            if (attParent) {
                const attElements = attParent.getElementsByTagNameNS(ns.groundspeak, "attribute");
                for (let att of attElements) {
                    const attId = parseInt(att.getAttribute("id"), 10);
                    attSet.add(attId);
                    attributes[attId] = (attributes[attId] || 0) + 1;
                }
            }

            if (attSet.has(4) && terrain === 5.0) {
                attrib4Terrain5Found = true;
            }
            if ([4, 11, 12].every(id => attSet.has(id))) {
                attrib4_11_12Found = true;
            }

            // Favo points (gsak)
            const wptExt = wpt.getElementsByTagNameNS(ns.gsak, "wptExtension")[0];
            if (wptExt) {
                const favElem = wptExt.getElementsByTagNameNS(ns.gsak, "FavPoints")[0];
                if (favElem && !isNaN(favElem.textContent)) {
                    favoSum += parseInt(favElem.textContent, 10);
                }
            }
        }

        displayResults({
            total,
            types,
            sizes,
            difficulties,
            terrains,
            diffTerrPairs,
            attributes,
            countries: Array.from(countries),
            states: Array.from(states),
            oldestDate,
            attrib4Terrain5Found,
            attrib4_11_12Found,
            favoSum,
        });
    };

    reader.readAsText(file);
}

function displayResults(stats) {
    document.getElementById("results").innerHTML = `
        <h2>Analysis Results</h2>
        <p><strong>Total caches:</strong> ${stats.total}</p>
        <p><strong>Oldest cache:</strong> ${stats.oldestDate ? stats.oldestDate.toISOString().slice(0,10) : "?"}</p>
        <p><strong>Total favorite points:</strong> ${stats.favoSum}</p>
        <h3>Cache Types</h3>
        ${generateTable(stats.types, "Tyyppi", "Määrä")}
        <h3>Koot</h3>
        ${generateTable(stats.sizes, "Koko", "Määrä")}
        <h3>Difficulty</h3>
        ${generateTable(stats.difficulties, "Difficulty", "Määrä", true)}
        <h3>Terrain</h3>
        ${generateTable(stats.terrains, "Terrain", "Määrä", true)}
        <h3>Difficulty / Terrain yhdistelmät</h3>
        ${generateTable(stats.diffTerrPairs, "D/T", "Määrä", true)}
        <h3>Attribuutit</h3>
        ${generateAttribTable(stats.attributes)}
        <h3>Erikoisehdot</h3>
        <ul>
            <li>Attribuutti 4 & Terrain 5: ${stats.attrib4Terrain5Found ? 'Kyllä' : 'Ei'}</li>
            <li>Attribuutit 4 & 11 & 12: ${stats.attrib4_11_12Found ? 'Kyllä' : 'Ei'}</li>
        </ul>
        <h3>Maat ja alueet</h3>
        <p><strong>Maat:</strong> ${stats.countries.join(", ")}</p>
        <p><strong>Alueet:</strong> ${stats.states.join(", ")}</p>
    `;
}

function generateTable(data, col1, col2, sortNumeric = false) {
    let entries = Object.entries(data);
    if (sortNumeric) {
        entries = entries.sort((a, b) => parseFloat(a[0]) - parseFloat(b[0]));
    } else {
        entries = entries.sort();
    }
    const rows = entries.map(([key, value]) => `<tr><td>${key}</td><td>${value}</td></tr>`).join("");
    return `<table><tr><th>${col1}</th><th>${col2}</th></tr>${rows}</table>`;
}

function generateAttribTable(attributes) {
    const rows = Object.entries(attributes)
        .sort((a, b) => parseInt(a[0]) - parseInt(b[0]))
        .map(([aid, count]) => {
            const info = ATTRIBUTE_NAMES[aid] || { value: "Tuntematon attribuutti", icon: "unknown" };
            return `<tr><td>${aid}</td><td>${info.value}</td><td>${count}</td></tr>`;
        }).join("");
    return `<table><tr><th>ID</th><th>Nimi</th><th>Määrä</th></tr>${rows}</table>`;
}

document.getElementById("fileInput").addEventListener("change", function(event) {
    const file = event.target.files[0];
    if (file) {
        parseGPX(file);
    }
});
