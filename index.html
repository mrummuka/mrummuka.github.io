<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX Analysis Web App</title>
    <style>
        body { font-family: sans-serif; margin: 1em; }
        table { border-collapse: collapse; width: 100%; font-size: 0.9em; }
        th, td { border: 1px solid #ccc; padding: 4px; }
        th { background: #eee; }
        h2 { margin-top: 1em; }
        .flex-row {
            display: flex;
            gap: 2em;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .dttable th, .dttable td {
            text-align: center;
            vertical-align: middle;
        }
        .flex-row > div {
            min-width: 320px;
        }
                .attributetable {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(48px, 1fr));
            gap: 4px;
            justify-items: center;
            align-items: center;
            max-width: 100%;
        }
        .attribcell {
            text-align: center;
            padding: 2px;
            background: none;
        }
        .attribcell.bg-grey {
            background: #eee;
        }
        .pstable-small {
            font-size: 0.85em;
            border-collapse: collapse;
        }
        .pstable-small th,
        .pstable-small td {
            padding: 1px 2px;
            text-align: center;
            vertical-align: middle;
            min-width: 16px;
            max-width: 22px;
            width: 18px;
        }
        #map {
            height: 500px;
            transition: all 0.3s ease; /* Smooth transition for size changes */
        }
        #map.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000; /* Ensure map is above other content */
        }
        /* Style for custom Leaflet control to match zoom buttons */
        .leaflet-control-fullscreen a {
            background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>') no-repeat center;
            background-size: 18px 18px;
        }
        .leaflet-control-fullscreen.leaflet-control-minimize a {
            background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>') no-repeat center;
            background-size: 18px 18px;
        }
        .leaflet-control-zoom-reset {
            font-size: 18px;
            line-height: 26px;
            text-align: center;
            background: #fff;
            color: #000;
            display: block;
            width: 26px;
            height: 26px;
            border-radius: 2px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.65);
            margin-top: 2px;
            text-decoration: none;
        }
        .filter-control {
            margin: 1em 0;
            padding: 0.5em;
            background: #f5f5f5;
            border-radius: 4px;
        }
        .filter-control label {
            margin-right: 1em;
            font-weight: bold;
        }
        .filter-control input {
            margin-right: 0.5em;
        }
        .filter-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-height: 180px;
            overflow-y: auto;
        }
        .filter-item {
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 3px;
        }
        .filter-item.selected {
            background: #1976d2;
            color: #fff;
            font-weight: bold;
        }
        .countries-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            font-size: 0.8em;
            margin-bottom: 1em;
        }
        .country-tag {
            background: #f8f8f8;
            color: #1976d2;
            border-radius: 2px;
            padding: 2px 6px;
            margin: 2px 0;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .country-tag img {
            width: 18px;
            height: 12px;
            object-fit: cover;
            margin-right: 4px;
        }
        .country-tag .country-count {
            color: #888;
            font-weight: normal;
            margin-left: 2px;
        }
        .country-tag .country-percent {
            color: #aaa;
            font-size: 0.8em;
            margin-left: 2px;
        }
        .regions-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            font-size: 0.8em;
            margin-bottom: 1em;
        }
        .region-tag {
            background: #e3f2fd;
            color: #1976d2;
            border-radius: 2px;
            padding: 2px 6px;
            margin: 2px 0;
            font-weight: bold;
        }
        .region-tag .region-count {
            color: #888;
            font-weight: normal;
            margin-left: 2px;
        }
        #countryFilterList, #regionFilterList {
            border: 2px solid #1976d2;
            border-radius: 6px;
            background: #f0f6ff;
            padding: 8px;
            margin-top: 4px;
            margin-bottom: 8px;
        }
        .zero-cell {
            background: #f3f3f3;
            color: #bbb;
            font-weight: normal;
        }

    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- Font Awesome for globe icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

    <!-- Leaflet.awesome-markers CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.awesome-markers@2.0.5/dist/leaflet.awesome-markers.css">
    <script src="https://cdn.jsdelivr.net/npm/leaflet.awesome-markers@2.0.5/dist/leaflet.awesome-markers.js"></script>

    <!-- leaflet plugin for graticules -->
    <script src="L.Graticule.js"></script>

function parseGPX(file) {
    const parser = new DOMParser();
    const reader = new FileReader();

    reader.onload = async function(event) {
        const xml = event.target.result;
        const doc = parser.parseFromString(xml, "application/xml");
        const ns = {
            gpx: "http://www.topografix.com/GPX/1/0",
            groundspeak: "http://www.groundspeak.com/cache/1/0/1",
            gsak: "http://www.gsak.net/xmlv1/6"
        };

        const wpts = doc.getElementsByTagNameNS(ns.gpx, "wpt");
        let total = 0;
        let cacheCoords = [];
        let cacheList = [];
        const latList = [];
        const lonList = [];
        let oldestDate = null;
        let favoSum = 0;
        let attributes = {};

        let countries = {};
        let regions = {};


        for (let wpt of wpts) {
            const cache = wpt.getElementsByTagNameNS(ns.groundspeak, "cache")[0];
            if (!cache) continue;

            // Type
            const type = cache.getElementsByTagNameNS(ns.groundspeak, "type")[0]?.textContent || "?";
            if (type === "User defined cache") {
                continue; // Skip this cache
            }

            // Validate type against TYPE_NAMES_ICONS
            if (!TYPE_NAMES_ICONS.hasOwnProperty(type)) {
                // Optionally: skip this cache, or set to "Unknown", or log a warning
                continue; // to skip
                console.warn(`Skipping unexpected cache type: "${type}"`);
            }

            total++;

            // Coords
            const lat = parseFloat(wpt.getAttribute("lat"));
            const lon = parseFloat(wpt.getAttribute("lon"));
            if (!isNaN(lat) && !isNaN(lon)) {
                cacheCoords.push([lat, lon]);
                latList.push(lat);
                lonList.push(lon);
            }

            // Gccode
            const gccode = wpt.getElementsByTagName("name")[0]?.textContent || "";
            // Name
            const name = cache.getElementsByTagNameNS(ns.groundspeak, "name")[0]?.textContent || "";


            // Size/Container
            const container = cache.getElementsByTagNameNS(ns.groundspeak, "container")[0]?.textContent || "?";
            
            // Difficulty/Terrain
            const difficulty = parseFloat(cache.getElementsByTagNameNS(ns.groundspeak, "difficulty")[0]?.textContent || "0");
            const terrain = parseFloat(cache.getElementsByTagNameNS(ns.groundspeak, "terrain")[0]?.textContent || "0");

            // Hidden date
            const hidden = wpt.getElementsByTagName("time")[0]?.textContent || "";

            if (hidden) {
                const date = new Date(hidden);

                // Hidden year
                const year = date.getFullYear();

                // Hidden day of month
                const day = date.getDate();
                // Hidden month
                const month = date.getMonth() + 1; // Months are 0-indexed

                // Hidden day of week
                const weekday = date.getDay(); // 0 = Sunday, 1 = Monday, ..., 6 = Saturday
            }

            // Country/State
            const country = cache.getElementsByTagNameNS(ns.groundspeak, "country")[0]?.textContent || "";
            const state = cache.getElementsByTagNameNS(ns.groundspeak, "state")[0]?.textContent || "";

            // Attributes
            const attSet = new Set();
            const attParent = cache.getElementsByTagNameNS(ns.groundspeak, "attributes")[0];
            if (attParent) {
                const attElements = attParent.getElementsByTagNameNS(ns.groundspeak, "attribute");
                for (let att of attElements) {
                    const attId = parseInt(att.getAttribute("id"), 10);
                    attSet.add(attId);
                    attributes[attId] = (attributes[attId] || 0) + 1;
                }
            }
            // Special conditions
            let ist5boatcache = false;
            let istbelow5boatcache = false;
            let isboatswimwadecache = false;

            // T<5 + Boat attribute
            if (attSet.has(4) && terrain !== 5.0) {
                istbelow5boatcache=true;
            }
            // T5 + Boat attribute
            if (attSet.has(4) && terrain === 5.0) {
                ist5boatcache=true;
            }
            // Boat + Swim + Wading attributes
            if ([4, 11, 12].every(id => attSet.has(id))) {
                isboatswimwadecache=true;
            }

            let fp = 0;
            const wptExt = wpt.getElementsByTagNameNS(ns.gsak, "wptExtension")[0];
            if (wptExt) {
                const favElem = wptExt.getElementsByTagNameNS(ns.gsak, "FavPoints")[0];
                if (favElem && !isNaN(favElem.textContent)) {
                    fp = parseInt(favElem.textContent, 10);
                }
            }

            cacheList.push({
                gccode,
                name,
                country,
                region: state,
                type,
                size: container,
                location: [country, state].filter(Boolean).join(" / "),
                fp,
                hidden,
                difficulty,
                terrain,
                coords: [lat, lon],
                lat,
                lon,
                elevation: null,
                attributes: Array.from(attSet).map(id => ({
                    id,
                    count: attributes[id] || 0
                })),
                istbelow5boatcache,
                ist5boatcache,
                isboatswimwadecache
            });

        }

         // 🌍 Haetaan korkeusarvot kaikille pisteille yhdellä kutsulla
        let elevations = [];
        if (latList.length > 0) {
            elevations = await fetchElevationsInChunks(latList, lonList, 100); // allowed max 100 per query
        }
        cacheList.forEach((cache, i) => {
            cache.elevation = elevations[i] ?? null;
        });

        // Build country and region objects
        cacheList.forEach(cache => {
            if (cache.country) {
                countries[cache.country] = (countries[cache.country] || 0) + 1;
            }
            if (cache.region) {
                regions[cache.region] = (regions[cache.region] || 0) + 1;
            }
        });

        window._fullCacheList = cacheList;
        updateFilteredResults();

    };

    reader.readAsText(file);
}

function computeStatsFromCacheList(cacheList) {
    const types = {};
    const sizes = {};
    const difficulties = {};
    const terrains = {};
    const diffTerrPairs = {};
    const years = {};
    const days = {};
    const months = {};
    const weekdays = {};
    const attributes = {};
    const countries = {};
    const regions = {};
    let oldestDate = null;
    let favoSum = 0;
    let t5BoatCaches = 0;
    let tbelow5BoatCaches = 0;
    let boatSwimWadingCaches = 0;

    let cacheCoords = [];
    let elevation = null;

    for (let cache of cacheList) {
        types[cache.type] = (types[cache.type] || 0) + 1;
        sizes[cache.size] = (sizes[cache.size] || 0) + 1;
        difficulties[cache.difficulty] = (difficulties[cache.difficulty] || 0) + 1;
        terrains[cache.terrain] = (terrains[cache.terrain] || 0) + 1;
        diffTerrPairs[`${cache.difficulty}/${cache.terrain}`] = (diffTerrPairs[`${cache.difficulty}/${cache.terrain}`] || 0) + 1;

        if (cache.hidden) {
            const date = new Date(cache.hidden);
            const year = date.getFullYear();
            years[year] = (years[year] || 0) + 1;
            const day = date.getDate();
            days[day] = (days[day] || 0) + 1;
            const month = date.getMonth() + 1;
            months[month] = (months[month] || 0) + 1;
            const weekday = date.getDay();
            weekdays[weekday] = (weekdays[weekday] || 0) + 1;
            if (!oldestDate || date < oldestDate) {
                oldestDate = date;
            }
        }

        if (cache.country) {
            countries[cache.country] = (countries[cache.country] || 0) + 1;
        }
        if (cache.region) {
            regions[cache.region] = (regions[cache.region] || 0) + 1;
        }

        cacheCoords.push([cache.lat, cache.lon]);

        cache.attributes.forEach(att => {
            attributes[att.id] = (attributes[att.id] || 0) + 1;
        });

        // Special conditions
        if (cache.attributes.some(a => a.id === 4) && cache.terrain !== 5.0) {
            tbelow5BoatCaches++;
        }
        if (cache.attributes.some(a => a.id === 4) && cache.terrain === 5.0) {
            t5BoatCaches++;
        }
        if ([4, 11, 12].every(id => cache.attributes.some(a => a.id === id))) {
            boatSwimWadingCaches++;
        }

        favoSum += cache.fp || 0;
    }

    return {
        cacheCoords,
        elevation,
        cacheList,
        total: cacheList.length,
        types,
        sizes,
        difficulties,
        terrains,
        diffTerrPairs,
        years,
        days,
        months,
        weekdays,
        attributes,
        countries,
        regions,
        oldestDate,
        t5BoatCaches,
        tbelow5BoatCaches,
        boatSwimWadingCaches,
        favoSum,
    };
}

function getAllCountriesAndRegions(cacheList) {
    const countries = {};
    const regions = {};
    cacheList.forEach(cache => {
        if (cache.country) {
            countries[cache.country] = (countries[cache.country] || 0) + 1;
        }
        if (cache.region) {
            regions[cache.region] = (regions[cache.region] || 0) + 1;
        }
    });
    return { countries, regions };
}

function getFilteredCacheList(cacheList, selectedCountries, selectedRegions) {
    return cacheList.filter(cache => {
        const countryMatch = selectedCountries.length === 0 || selectedCountries.includes(cache.country);
        const regionMatch = selectedRegions.length === 0 || selectedRegions.includes(cache.region);
        return countryMatch && regionMatch;
    });
}

async function fetchElevationsInChunks(latList, lonList, chunkSize = 50) {
    const elevationResults = [];
    let limitExceeded = false;

    for (let i = 0; i < latList.length; i += chunkSize) {
        if (limitExceeded) {
            // Fill remaining with null
            elevationResults.push(...new Array(latList.length - elevationResults.length).fill(null));
            break;
        }

        const latChunk = latList.slice(i, i + chunkSize);
        const lonChunk = lonList.slice(i, i + chunkSize);

        const latParam = latChunk.join(",");
        const lonParam = lonChunk.join(",");

        const url = `https://api.open-meteo.com/v1/elevation?latitude=${latParam}&longitude=${lonParam}`;

        try {
            const resp = await fetch(url);
            const data = await resp.json();

            console.log("[DEBUG] Elevation API response:", data);

            // More robust error check
            if (
                (data.error && data.reason && data.reason.toLowerCase().includes("limit")) ||
                (data.reason && data.reason.toLowerCase().includes("limit")) ||
                (data.error && typeof data.error === "string" && data.error.toLowerCase().includes("limit"))
            ) {
                console.warn("Elevation API limit exceeded, stopping further requests.");
                limitExceeded = true;
                elevationResults.push(...new Array(latChunk.length).fill(null));
            } else if (Array.isArray(data.elevation)) {
                elevationResults.push(...data.elevation);
            } else {
                console.warn("Unexpected elevation response:", data);
                elevationResults.push(...new Array(latChunk.length).fill(null));
            }
        } catch (err) {
            console.error("Elevation fetch failed:", err);
            elevationResults.push(...new Array(latChunk.length).fill(null));
        }
    }
    return elevationResults;
}

function highlightCountries( foundCountries, map ) {
    if( _countriesGeoJson ) {
        if (window._leafletMap === map) {
            // Helper: normalize country names for comparison
            function normalize(name) {
                return (name || "").trim();
            }
            // Build normalized set for foundCountries
            const foundCountriesNorm = new Set(Array.from(foundCountries).map(normalize));
            const geoJsonCountryNames = new Set(
                _countriesGeoJson.features.map(f => GEOJSON_TO_GPX_COUNTRY_MAP[normalize(f.properties.name) ] || normalize(f.properties.name))
            );

            // Find countries in foundCountries that do not match any GeoJSON country
            const unmatchedCountries = Array.from(foundCountries).filter(c => 
                !geoJsonCountryNames.has(normalize(c))
            );
            if (unmatchedCountries.length > 0) {
                console.warn("[WARN] The following countries were not matched in GeoJSON and will NOT be highlighted:", unmatchedCountries);
            }

            return L.geoJSON(_countriesGeoJson, {
                style: feature => {
                    const countryName = normalize(feature.properties.name) || "";
                    const gpxName = GEOJSON_TO_GPX_COUNTRY_MAP[countryName] || countryName;
                    const isHighlighted = foundCountriesNorm.has(gpxName);
                    // Debug: log matched countries
                    if (isHighlighted) {
                        console.debug("Highlighting country:", gpxName);
                    }
                    return isHighlighted
                        ? { color: '#e53935', weight: 2, fillOpacity: 0.2 }
                        : { color: '#888', weight: 0.5, fillOpacity: 0 };
                }
            })
        }
    }
    else {
        console.error("Countries GeoJSON not loaded");
        return L.layerGroup([]);
    }
}

function getMapBoundaries(map) {
    let bounds = map.getBounds();
    return {
        minLat: Math.floor(bounds.getSouth()),
        maxLat: Math.ceil(bounds.getNorth()),
        minLon: Math.floor(bounds.getWest()),
        maxLon: Math.ceil(bounds.getEast())
    };
}

function getUniqueGraticules(cachePoints) {
    if (!Array.isArray(cachePoints) || cachePoints.length === 0) {
        console.warn("cachePoints is empty or not an array");
        return [];
    }

    const uniqueGraticules = new Set();

    cachePoints.forEach((point, index) => {
        if (!Array.isArray(point) || point.length !== 2 || typeof point[0] !== 'number' || typeof point[1] !== 'number') {
            console.warn(`Invalid cachePoint at index ${index}:`, point);
            return;
        }
        const lat = Math.floor(point[0]);
        const lon = Math.floor(point[1]);
        uniqueGraticules.add(`${lat}|${lon}`);
    });

    // Minimal debugging: Log the number of unique graticules found
    console.log(`Found ${uniqueGraticules.size} unique graticules from ${cachePoints.length} points`);

    return Array.from(uniqueGraticules).map(key => key.split('|').map(Number));
}

function highlightMissingGraticules(cachePoints, map) {
    let overlays = [];
    let { minLat, maxLat, minLon, maxLon } = getMapBoundaries(map);

    for (let lat = minLat; lat <= maxLat; lat++) {
        for (let lon = minLon; lon < maxLon; lon++) {
            let found = cachePoints.some(p => p[0] >= lat && p[0] < lat+1 &&
                                              p[1] >= lon && p[1] < lon+1);
            if (!found) {
                let poly = L.rectangle([[lat, lon],[lat+1, lon+1]], {
                    color: "#A0A0A0",
                    weight: 0,
                    fillColor: "#A0A0A0",
                    fillOpacity: 0.25
                });
                overlays.push(poly);
            }
        }
    }
    console.debug("Found missing graticules:", overlays);
    return L.layerGroup(overlays);
}

function highlightFoundGraticules(graticules, map) {
    // Validate inputs
    if (!map || typeof map.getBounds !== 'function') {
        console.error("Invalid map object: getBounds is not a function");
        return L.layerGroup([]);
    }
    if (!Array.isArray(graticules)) {
        console.error("graticules is not an array or is undefined/null");
        return L.layerGroup([]);
    }

    const overlays = graticules
            .filter(([lat, lon]) => typeof lat === 'number' && typeof lon === 'number' && !isNaN(lat) && !isNaN(lon))
            .map(([lat, lon]) => L.rectangle([[lat, lon], [lat + 1, lon + 1]], {
                color: "#0f0",
                weight: 0,
                fillColor: "#0f0",
                fillOpacity: 0.15
            }));

        console.log(`Rendering ${overlays.length} graticule rectangles`);

    return L.layerGroup(overlays);
}

function generateHiddenDateHeatmap(cacheList) {
    // Prepare a 12x31 matrix for months (0-11) and days (0-30)
    const counts = Array.from({length: 12}, () => Array(31).fill(0));
    for (const cache of cacheList) {
        if (!cache.hidden) continue;
        const date = new Date(cache.hidden);
        if (isNaN(date)) continue;
        const m = date.getMonth(); // 0-11
        const d = date.getDate();  // 1-31
        counts[m][d-1]++;
    }

    // For each month, find min/max (nonzero) for color scaling
    function getColor(val, min, max) {
        if (val === 0) return "background-color: #eee; color: #888;";
        // Color scale: dark green (#43a047) -> yellow (#bcc800) -> orange (#c88e00) -> red (#c86300)
        // We'll interpolate between green (low), yellow (mid), red (high)
        const green = [67, 160, 71];
        const yellow = [188, 200, 0];
        const orange = [200, 142, 0];
        const red = [200, 99, 0];
        if (max === min) return `background-color: rgb(${green.join(",")}); color: #fff;`;
        let color;
        if (val === max) {
            color = red;
        } else if (val === min) {
            color = green;
        } else {
            // Interpolate: green -> yellow -> orange -> red
            const ratio = (val - min) / (max - min);
            if (ratio < 0.5) {
                // green to yellow
                const r = green.map((g, i) => Math.round(g + (yellow[i] - g) * (ratio * 2)));
                color = r;
            } else if (ratio < 0.8) {
                // yellow to orange
                const r = yellow.map((y, i) => Math.round(y + (orange[i] - y) * ((ratio - 0.5) / 0.3)));
                color = r;
            } else {
                // orange to red
                const r = orange.map((o, i) => Math.round(o + (red[i] - o) * ((ratio - 0.8) / 0.2)));
                color = r;
            }
        }
        return `background-color: rgb(${color.join(",")}); color: #fff;`;
    }

    const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    let html = `<table class="pstable-small"><tbody>`;
    // Header row
    html += `<tr><td></td>`;
    for (let d = 1; d <= 31; d++) html += `<td class="align-center"><b>${d}</b></td>`;
    html += `<td class="nobgcolor"></td></tr>`;

    // Data rows
    for (let m = 0; m < 12; m++) {
        // Find min/max for this month (nonzero)
        const row = counts[m];
        const nonzero = row.filter(v => v > 0);
        const min = nonzero.length ? Math.min(...nonzero) : 0;
        const max = nonzero.length ? Math.max(...nonzero) : 0;
        let rowSum = 0;
        html += `<tr><td><b>${monthNames[m]}</b></td>`;
        for (let d = 0; d < 31; d++) {
            const val = row[d];
            if (val === 0) {
                html += `<td class="align-center" style="background-color: #eee; color: #888;"></td>`;
            } else {
                html += `<td class="align-center" style="${getColor(val, min, max)}">${val}</td>`;
                rowSum += val;
            }
        }
        html += `<td class="align-right">${rowSum}</td></tr>`;
    }

    // Add column sums row
    let colSums = Array(31).fill(0);
    for (let m = 0; m < 12; m++) {
        for (let d = 0; d < 31; d++) {
            colSums[d] += counts[m][d];
        }
    }
    html += `<tr><td class="nobgcolor"></td>`;
    for (let d = 0; d < 31; d++) {
        const val = colSums[d];
        html += `<td class="align-center" style="color: #000;">${val}</td>`;
    }
    html += `<td class="nobgcolor"></td></tr>`;

    html += `</tbody></table>`;
    return html;
}

function generateHiddenMonthHeatmap(cacheList) {
    // Prepare a year x month matrix
    const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const yearSet = new Set();
    const counts = {};

    // Collect counts and years
    for (const cache of cacheList) {
        if (!cache.hidden) continue;
        const date = new Date(cache.hidden);
        if (isNaN(date)) continue;
        const y = date.getFullYear();
        const m = date.getMonth(); // 0-11
        yearSet.add(y);
        if (!counts[y]) counts[y] = Array(12).fill(0);
        counts[y][m]++;
    }

    // Get all years from 2000 to current year
    const currentYear = new Date().getFullYear();
    const years = [];
    for (let y = 2000; y <= currentYear; y++) years.push(y);

    // Color scale function (per row)
    function getColor(val, min, max) {
        if (val === 0) return "background-color: #eee; color: #888;";
        // Green (#14c800) to Red (#c86300)
        const green = [20, 200, 0];
        const red = [200, 99, 0];
        if (max === min) return `background-color: rgb(${green.join(",")}); color: #fff;`;
        const ratio = (val - min) / (max - min);
        const color = green.map((g, i) => Math.round(g + (red[i] - g) * ratio));
        return `background-color: rgb(${color.join(",")}); color: #fff;`;
    }

    let html = `<table class="pstable-small"><tbody>`;
    // Header row
    html += `<tr><th></th>`;
    for (let m = 0; m < 12; m++) html += `<th class="align-center"><b>${monthNames[m]}</b></th>`;
    html += `<th class="align-right"></th></tr>`;

    // Data rows
    for (const y of years) {
        const row = counts[y] || Array(12).fill(0);
        const nonzero = row.filter(v => v > 0);
        const min = nonzero.length ? Math.min(...nonzero) : 0;
        const max = nonzero.length ? Math.max(...nonzero) : 0;
        let rowSum = 0;
        html += `<tr><td><b>${y}</b></td>`;
        for (let m = 0; m < 12; m++) {
            const val = row[m];
            if (val === 0) {
                html += `<td class="align-center" style="background-color: #eee; color: #888;"></td>`;
            } else {
                html += `<td class="align-center" style="${getColor(val, min, max)}">${val}</td>`;
                rowSum += val;
            }
        }
        html += `<td class="align-right">${rowSum}</td></tr>`;
    }

    // Add column sums row
    let colSums = Array(12).fill(0);
    for (const y of years) {
        const row = counts[y] || Array(12).fill(0);
        for (let m = 0; m < 12; m++) {
            colSums[m] += row[m];
        }
    }
    html += `<tr><td class="nobgcolor"></td>`;
    for (let m = 0; m < 12; m++) {
        const val = colSums[m];
        html += `<td class="align-center" style="color: #000;">${val}</td>`;
    }
    html += `<td class="nobgcolor"></td></tr>`;
    
    html += `</tbody></table>`;
    return html;
}

function interpolateColor(val, min, max) {
    // Green -> Orange -> Red
    // min = green, mid = orange, max = red
    const green = [67, 160, 71];
    const orange = [251, 192, 45];
    const red = [229, 57, 53];
    if (max === min) return `rgb(${green.join(",")})`;
    const mid = (max + min) / 2;
    let color;
    if (val <= mid) {
        // Green to Orange
        const ratio = (val - min) / (mid - min || 1);
        color = green.map((g, i) => Math.round(g + ratio * (orange[i] - g)));
    } else {
        // Orange to Red
        const ratio = (val - mid) / (max - mid || 1);
        color = orange.map((o, i) => Math.round(o + ratio * (red[i] - o)));
    }
    return `rgb(${color.join(",")})`;
}

// Updated code to handle type and size filters
function generateDTMatrix(cacheList, typeFilter = null, sizeFilter = null) {
    const values = [1.0,1.5,2.0,2.5,3.0,3.5,4.0,4.5,5.0];

    // Filter caches by type and size if filters are set
    const filtered = cacheList.filter(c =>
        (!typeFilter || c.type === typeFilter) &&
        (!sizeFilter || c.size === sizeFilter)
    );

    // Build D/T pairs as in original approach
    const diffTerrPairs = {};
    for (let c of filtered) {
        const key = `${c.difficulty}/${c.terrain}`;
        diffTerrPairs[key] = (diffTerrPairs[key] || 0) + 1;
    }

    // Gather all nonzero counts for color scaling
    let allCounts = [];

    for (let d of values) for (let t of values) {
        const key = `${d}/${t}`;
        const count = diffTerrPairs[key] || 0;
        if (count > 0) allCounts.push(count);
    }
    const min = Math.min(...allCounts);
    const max = Math.max(...allCounts);

    // Build filter row
    let html = `<table class="dttable">
    <tr>
      <th colspan="6" style="cursor:pointer" id="dt-type-filter">Type: ${typeFilter || '-'}</th>
      <th colspan="6" style="cursor:pointer" id="dt-size-filter">Size: ${sizeFilter || '-'}</th>
    </tr>`;

    // Header row
    html += `<tr><th>D \\ T</th>`;
    for (const t of values) html += `<th>${t.toFixed(1)}</th>`;
    html += `<th>Total</th></tr>`;

    let colTotals = Array(values.length).fill(0);
    let grandTotal = 0;
    for (let d = 0; d < values.length; d++) {
        let rowTotal = 0;
        html += `<tr><th>${values[d].toFixed(1)}</th>`;
        for (let t = 0; t < values.length; t++) {
            const key = `${values[d]}/${values[t]}`;
            const count = diffTerrPairs[key] || 0;
            let cell = "";
            let style = "";
            if (count > 0) {
                style = `background:${interpolateColor(count, min, max)};color:#222;font-weight:bold;`;
                cell = count;
            }
            html += `<td style="${style}">${cell}</td>`;
            rowTotal += count;
            colTotals[t] += count;
            grandTotal += count;
        }
        html += `<td><b>${rowTotal}</b></td></tr>`;
    }
    html += `<tr><th>Total</th>`;
    for (const total of colTotals) html += `<td><b>${total}</b></td>`;
    html += `<td><b>${grandTotal}</b></td></tr>`;
    html += `</table>`;
    return html;
}

function setupFilterListeners() {
    document.querySelectorAll('#countryFilterList .filter-item').forEach(item => {
        item.onclick = function() {
            const value = this.getAttribute('data-value');
            if (selectedCountries.includes(value)) {
                selectedCountries = selectedCountries.filter(c => c !== value);
            } else {
                selectedCountries.push(value);
            }
            updateFilteredResults();
        };
    });
    document.querySelectorAll('#regionFilterList .filter-item').forEach(item => {
        item.onclick = function() {
            const value = this.getAttribute('data-value');
            if (selectedRegions.includes(value)) {
                selectedRegions = selectedRegions.filter(r => r !== value);
            } else {
                selectedRegions.push(value);
            }
            updateFilteredResults();
        };
    });
}





document.getElementById("fileInput").addEventListener("change", function(event) {
    const file = event.target.files[0];
    if (file) {
        parseGPX(file);
    }
});

function updateFilteredResults() {
    filterRequestId++;
    const currentId = filterRequestId;
    const filteredCacheList = getFilteredCacheList(window._fullCacheList, selectedCountries, selectedRegions);
    const stats = computeStatsFromCacheList(filteredCacheList);
    displayResults(stats, currentId);
}


// Add event listener for filter changes
document.querySelectorAll('input[name="displayFilter"]').forEach(radio => {
    radio.addEventListener('change', function() {
        updateFilteredResults();
    });
});


</script>
